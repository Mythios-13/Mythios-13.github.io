<body>
<div id="wrap"><canvas id="game" width="480" height="270"></canvas></div>
<script>
'use strict';
/* ================================================================
   VOIDFALL — pixel-art doom-like. Single file, zero dependencies.
   ================================================================ */

// ---------- config ----------
const CFG={
  bufW:480, bufH:270,
  fov:66*Math.PI/180,
  mapW:120, mapH:120,
  roomsTarget:22,
  quota:4000,
  playerSpeed:4.4, rotSpeed:2.7,
  maxHp:100,
  shadowLevels:6,
  spriteShadows:4,
  fogDist:30,
  wallHp:{stone:34,brick:26,metal:46,tech:52,brk:18,door:999},
};
const T={EMPTY:0,WALL:1,BRK:2,DOOR:3};
const DECO_KINDS=['neon','banner','poster'];

// ---- display modes: low = 480x270 + CRT scanlines, hd = 960x540 crisp ----
const LW=480, LH=270;                    // logical coordinate system
const Display={mode:'low', w:480, h:270, S:1};
let crtCanvas=null, vigCanvas=null;
function setDisplayMode(mode){
  Display.mode=mode;
  const hd=(mode==='hd');
  Display.w=hd?960:480; Display.h=hd?540:270; Display.S=Display.w/LW;
  cv.width=Display.w; cv.height=Display.h;
  ctx.imageSmoothingEnabled=false;
  buildOverlayCache();
  resize();
}
function toggleDisplayMode(){ setDisplayMode(Display.mode==='low'?'hd':'low'); AudioSys.ui(); }
function buildOverlayCache(){
  const w=Display.w, h=Display.h;
  // CRT scanlines + vignette (low mode)
  crtCanvas=mkCanvas(w,h);
  const g=crtCanvas.getContext('2d');
  g.fillStyle='rgba(0,0,0,0.30)';
  for(let y=0;y<h;y+=3)g.fillRect(0,y,w,1);
  const vg=g.createRadialGradient(w/2,h/2,h*0.30,w/2,h/2,h*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.45)');
  g.fillStyle=vg; g.fillRect(0,0,w,h);
  // vignette only (hd mode)
  vigCanvas=mkCanvas(w,h);
  const g2=vigCanvas.getContext('2d');
  const vg2=g2.createRadialGradient(w/2,h/2,h*0.35,w/2,h/2,h*0.85);
  vg2.addColorStop(0,'rgba(0,0,0,0)'); vg2.addColorStop(1,'rgba(0,0,0,0.30)');
  g2.fillStyle=vg2; g2.fillRect(0,0,w,h);
}

// ---------- tiny utils ----------
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const irand=(a,b)=>Math.floor(rand(a,b+1));
const choice=arr=>arr[(Math.random()*arr.length)|0];
const fmtMoney=n=>'$'+Math.floor(n).toLocaleString('en-US');
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
const nowMs=()=>(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
const later=(fn,ms)=>{if(typeof setTimeout!=='undefined')setTimeout(fn,ms);};

// ---------- canvas ----------
const cv=document.getElementById('game');
const ctx=cv.getContext('2d',{alpha:false});
ctx.imageSmoothingEnabled=false;
const BW=LW, BH=LH;              // logical units (drawn under transform)
const DW=()=>Display.w, DH=()=>Display.h;
function resize(){
  const aw=window.innerWidth||800, ah=window.innerHeight||600;
  const ar=Display.w/Display.h;
  let w=aw,h=Math.round(aw/ar);
  if(h>ah){h=ah;w=Math.round(ah*ar);}
  cv.style.width=w+'px'; cv.style.height=h+'px';
}
if(typeof window!=='undefined'&&window.addEventListener)window.addEventListener('resize',resize);

// ---------- audio (synth) ----------
const AudioSys={
  ctx:null,master:null,muted:false,started:false,musicTimer:null,musicStep:0,
  init(){ if(this.started)return; this.started=true;
    try{
      const AC=(typeof window!=='undefined')?(window.AudioContext||window.webkitAudioContext):null; if(!AC)return;
      this.ctx=new AC(); this.master=this.ctx.createGain(); this.master.gain.value=0.32; this.master.connect(this.ctx.destination);
      this.startMusic();
    }catch(e){}
  },
  tone(freq,dur,type,vol,slideTo){ if(!this.ctx||this.muted)return; try{
    const t=this.ctx.currentTime, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(freq,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.03);
  }catch(e){} },
  noise(dur,vol,filterFreq,type){ if(!this.ctx||this.muted)return; try{
    const t=this.ctx.currentTime, len=Math.max(1,(dur*this.ctx.sampleRate)|0);
    const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const f=this.ctx.createBiquadFilter(); f.type=type||'lowpass'; f.frequency.value=filterFreq||1200;
    const g=this.ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    src.connect(f); f.connect(g); g.connect(this.master); src.start(t); src.stop(t+dur+0.03);
  }catch(e){} },
  shoot(){this.noise(0.09,0.45,2600,'highpass'); this.tone(220,0.08,'square',0.22,90);},
  shotgun(){this.noise(0.22,0.65,900,'lowpass'); this.tone(140,0.16,'sawtooth',0.32,50);},
  rocket(){this.noise(0.5,0.65,520,'lowpass'); this.tone(95,0.45,'sawtooth',0.38,30);},
  destructor(){this.noise(0.32,0.6,720,'lowpass'); this.tone(180,0.28,'square',0.28,42);},
  hit(){this.tone(330,0.06,'square',0.2,170);},
  hurt(){this.tone(110,0.18,'sawtooth',0.38,58); this.noise(0.12,0.28,420,'lowpass');},
  pickup(){this.tone(660,0.07,'square',0.22); later(()=>this.tone(990,0.09,'square',0.22),60);},
  coin(){this.tone(880,0.05,'square',0.18); later(()=>this.tone(1320,0.08,'square',0.18),45);},
  explode(){this.noise(0.6,0.8,420,'lowpass'); this.tone(70,0.5,'sine',0.5,28);},
  wallBreak(){this.noise(0.42,0.65,300,'lowpass'); this.noise(0.16,0.35,2400,'highpass');},
  reload(){this.tone(240,0.06,'square',0.18); later(()=>this.tone(370,0.06,'square',0.18),150);},
  empty(){this.tone(180,0.05,'square',0.13,120);},
  ui(){this.tone(520,0.05,'square',0.16);},
  win(){[523,659,784,1046].forEach((f,i)=>later(()=>this.tone(f,0.2,'square',0.28),i*140));},
  lose(){[330,262,196,131].forEach((f,i)=>later(()=>this.tone(f,0.26,'sawtooth',0.28),i*170));},
  startMusic(){ if(this.musicTimer||typeof setInterval==='undefined')return;
    const bass=[55,55,82.4,55,65.4,55,98,73.4];
    this.musicTimer=setInterval(()=>{ if(this.muted||!this.ctx)return;
      const f=bass[this.musicStep%bass.length];
      this.tone(f,0.22,'sawtooth',0.085);
      if(this.musicStep%4===0)this.tone(f*2,0.1,'square',0.045);
      this.musicStep++;
    },215);
  },
};

// ---------- pixel-art factory ----------
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function px(w,h,fn){const c=mkCanvas(w,h),g=c.getContext('2d');g.imageSmoothingEnabled=false;fn(g);return c;}
function shade(src,level){ // level: 0..1 brightness, preserves transparency
  const c=mkCanvas(src.width,src.height),g=c.getContext('2d');
  g.drawImage(src,0,0);
  g.globalCompositeOperation='multiply';
  g.fillStyle='rgb('+Math.round(255*level)+','+Math.round(255*level)+','+Math.round(255*level)+')';
  g.fillRect(0,0,c.width,c.height);
  // keep only pixels that were opaque in the source (restore transparency)
  g.globalCompositeOperation='destination-in';
  g.drawImage(src,0,0);
  return c;
}
function shadeSet(src,levels){const out=[];for(let i=0;i<levels;i++)out.push(shade(src,1-(i/(levels-1||1))*0.85));return out;}

// --- wall textures (64x64) ---
function texStone(){return px(64,64,g=>{
  g.fillStyle='#3a3f4a';g.fillRect(0,0,64,64);
  for(let y=0;y<8;y++)for(let x=0;x<8;x++){
    const v=irand(-14,14);
    g.fillStyle='rgb('+(58+v)+','+(63+v)+','+(74+v)+')';
    g.fillRect(x*8+1,y*8+1,6,6);
  }
  g.fillStyle='rgba(0,0,0,.35)';
  for(let i=0;i<40;i++)g.fillRect(irand(0,63),irand(0,63),2,1);
});}
function texBrick(){return px(64,64,g=>{
  g.fillStyle='#241a18';g.fillRect(0,0,64,64);
  for(let y=0;y<8;y++){const off=(y%2)*8;
    for(let x=-1;x<5;x++){
      const v=irand(-16,16);
      g.fillStyle='rgb('+(118+v)+','+(62+v*0.6|0)+','+(44+v*0.4|0)+')';
      g.fillRect(x*16+off+1,y*8+1,14,6);
    }}
  g.fillStyle='rgba(0,0,0,.25)';
  for(let i=0;i<30;i++)g.fillRect(irand(0,63),irand(0,63),2,1);
});}
function texMetal(){return px(64,64,g=>{
  g.fillStyle='#39424e';g.fillRect(0,0,64,64);
  for(let y=0;y<4;y++)for(let x=0;x<2;x++){
    g.fillStyle='#46525f';g.fillRect(x*32+2,y*16+2,28,12);
    g.fillStyle='#2b333d';g.fillRect(x*32+2,y*16+13,28,1);
    g.fillStyle='#5a6a7a';g.fillRect(x*32+2,y*16+2,28,1);
    g.fillStyle='#20262e';g.fillRect(x*32+4,y*16+4,2,2);g.fillRect(x*32+26,y*16+4,2,2);
  }
  g.fillStyle='#151a20';g.fillRect(0,31,64,2);
});}
function texTech(){return px(64,64,g=>{
  g.fillStyle='#141a22';g.fillRect(0,0,64,64);
  g.fillStyle='#1d2631';g.fillRect(2,2,60,60);
  g.strokeStyle='#0e3a44';g.lineWidth=2;g.strokeRect(6,6,52,52);
  g.fillStyle='#27e0d0';
  g.fillRect(10,10,4,4);g.fillRect(50,10,4,4);g.fillRect(10,50,4,4);g.fillRect(50,50,4,4);
  g.fillStyle='#12333a';g.fillRect(30,30,4,4);
  g.fillStyle='#1f8f86';g.fillRect(28,28,8,8);
  g.fillStyle='#27e0d0';g.fillRect(30,30,4,4);
});}
function texBreak(){return px(64,64,g=>{
  g.fillStyle='#5a4326';g.fillRect(0,0,64,64);
  g.fillStyle='#6e5432';g.fillRect(2,2,60,60);
  g.fillStyle='#3c2c17';
  for(let y=0;y<4;y++)g.fillRect(2,y*16+2,60,2);
  g.fillStyle='#c9a23a';
  for(let x=0;x<4;x++){g.fillRect(x*16+2,2,6,4);g.fillRect(x*16+2,58,6,4);}
  g.fillStyle='#241a0d';g.fillRect(29,29,6,6);
  g.fillStyle='#e04a1a';g.fillRect(30,30,4,4);
});}
function texExit(){return px(64,64,g=>{
  g.fillStyle='#0d1310';g.fillRect(0,0,64,64);
  g.fillStyle='#16241c';g.fillRect(4,4,56,56);
  g.fillStyle='#1f3327';g.fillRect(8,8,48,48);
  g.fillStyle='#39ff88';
  g.fillRect(30,10,4,44);g.fillRect(10,30,44,4);
  g.fillStyle='#0d1310';g.fillRect(28,28,8,8);
  g.fillStyle='#39ff88';g.fillRect(30,30,4,4);
  g.fillStyle='#0d1310';g.fillRect(0,0,64,4);g.fillRect(0,60,64,4);

function texFloor(){return px(64,64,g=>{
  g.fillStyle='#23262e';g.fillRect(0,0,64,64);
  for(let y=0;y<4;y++)for(let x=0;x<4;x++){
    const v=irand(-8,8);
    g.fillStyle='rgb('+(34+v)+','+(37+v)+','+(45+v)+')';
    g.fillRect(x*16+1,y*16+1,14,14);
  }
  g.fillStyle='rgba(0,0,0,.3)';
  for(let i=0;i<26;i++)g.fillRect(irand(0,63),irand(0,63),2,2);
});}

// --- sprites (drawn at native size, scaled by distance) ---

  g.beginPath();g.moveTo(28,20);g.lineTo(36,4);g.lineTo(24,14);g.closePath();g.fill();
  // body
  g.fillStyle='#8a2b1c';g.fillRect(11,16,14,20);
  g.fillStyle='#a83a22';g.fillRect(13,18,10,14);
  // head
  g.fillStyle='#8a2b1c';g.fillRect(12,6,12,12);
  g.fillStyle='#a83a22';g.fillRect(14,8,8,8);
  // horns
  g.fillStyle='#e8d8b0';g.fillRect(10,2,3,6);g.fillRect(23,2,3,6);
  // eyes
  g.fillStyle='#ffd23a';g.fillRect(15,10,2,2);g.fillRect(19,10,2,2);
  // legs

  // claws
  g.fillStyle='#e8d8b0';g.fillRect(12,41,4,2);g.fillRect(20,41,4,2);
});}

  g.fillStyle='#4a7a42';g.fillRect(6,36,6,8);g.fillRect(34,36,6,8); // fists

  g.fillStyle='#1c2e1b';g.fillRect(12,40,6,12);g.fillRect(28,40,6,12); // legs

function sprSpider(){return px(44,30,g=>{
  g.clearRect(0,0,44,30);
  g.strokeStyle='#3a2a4a';g.lineWidth=2;
  for(let i=0;i<3;i++){const x=8+i*13;
    g.beginPath();g.moveTo(x,14);g.lineTo(x-8,26);g.stroke();
    g.beginPath();g.moveTo(x,14);g.lineTo(x+8,26);g.stroke();}
  g.fillStyle='#4a3560';g.beginPath();g.ellipse(22,14,14,9,0,0,TAU);g.fill();
  g.fillStyle='#5d4478';g.beginPath();g.ellipse(22,12,9,6,0,0,TAU);g.fill();
  g.fillStyle='#ff3a3a';g.fillRect(18,10,2,2);g.fillRect(24,10,2,2);g.fillRect(21,13,2,2);
});}

// --- animation frame 1 variants (leg/wing swaps) ---
function sprImpFrame1(){return px(36,44,g=>{
  g.clearRect(0,0,36,44);
  // wings raised
  g.fillStyle='#5a1f1f';g.beginPath();g.moveTo(8,18);g.lineTo(0,2);g.lineTo(12,12);g.closePath();g.fill();
  g.beginPath();g.moveTo(28,18);g.lineTo(36,2);g.lineTo(24,12);g.closePath();g.fill();
  g.fillStyle='#8a2b1c';g.fillRect(11,16,14,20);
  g.fillStyle='#a83a22';g.fillRect(13,18,10,14);

// ---------- map generation ----------
const MAP_W=CFG.mapW, MAP_H=CFG.mapH;
let map=new Uint8Array(MAP_W*MAP_H);
let rooms=[];
function idx(x,y){return y*MAP_W+x;}
function inBounds(x,y){return x>=0&&y>=0&&x<MAP_W&&y<MAP_H;}
function tileAt(x,y){if(!inBounds(x,y))return T.WALL;return map[idx(x,y)];}

function genMap(){
  map.fill(T.WALL); rooms=[]; doors=[]; wallHp={}; decorations=[]; civilianRef=null;
  // Slot grid: 4 columns x 3 rows of room slots across the map (clear, readable layout)
  const cols=5, rows=3;
  const slotW=Math.floor(MAP_W/cols), slotH=Math.floor(MAP_H/rows);
  const slots=[];
  for(let gy=0;gy<rows;gy++)for(let gx=0;gx<cols;gx++)slots.push({gx,gy});
  // shuffle slots, keep first as start
  for(let i=slots.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=slots[i];slots[i]=slots[j];slots[j]=t;}
  const nRooms=Math.min(CFG.roomsTarget, slots.length);
  const chosen=slots.slice(0,nRooms);
  // place each room centered in its slot with fixed size
  for(let i=0;i<chosen.length;i++){
    const s=chosen[i];
    const w=irand(6,8), h=irand(5,7);
    const x=s.gx*slotW + Math.floor((slotW-w)/2);
    const y=s.gy*slotH + Math.floor((slotH-h)/2);
    const r={x,y,w,h,cx:x+(w>>1),cy:y+(h>>1),idx:i};
    rooms.push(r);
    for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)map[idx(xx,yy)]=T.EMPTY;
  }
  // connect rooms in order via straight corridors through slot boundaries
  for(let i=1;i<rooms.length;i++){
    const a=rooms[i-1],b=rooms[i];
    carveCorridor(a.cx,a.cy,b.cx,b.cy);
  }
  // a few extra loops
  for(let i=0;i<Math.floor(rooms.length/4);i++){
    const a=choice(rooms),b=choice(rooms);
    if(a!==b)carveCorridor(a.cx,a.cy,b.cx,b.cy);
  }
  // breakable walls: on room borders facing empty space (clearly visible)
  let brk=0;
  for(const r of rooms){
    if(brk>=20)break;
    // top edge
    for(let xx=r.x+1;xx<r.x+r.w-1&&brk<20;xx++){
      const ty=r.y-1;
      if(tileAt(xx,ty)===T.WALL && tileAt(xx,ty-1)===T.WALL){ map[idx(xx,ty)]=T.BRK; brk++; }
    }
    // bottom edge
    for(let xx=r.x+1;xx<r.x+r.w-1&&brk<20;xx++){
      const ty=r.y+r.h;
      if(tileAt(xx,ty)===T.WALL && tileAt(xx,ty+1)===T.WALL){ map[idx(xx,ty)]=T.BRK; brk++; }
    }
  }
  // doors: one per room except start — placed on the corridor entry to that room
  for(let i=1;i<rooms.length;i++){
    const r=rooms[i];
    const doorTile=findDoorTile(r);
    if(doorTile){
      map[idx(doorTile.x,doorTile.y)]=T.DOOR;
      doors.push({x:doorTile.x,y:doorTile.y,open:false,hp:999,id:i});
    }
  }
  // wall HP tracking: every WALL/BRK/DOOR tile gets an hp based on texture type
  for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
    const t=map[idx(x,y)];
    if(t===T.WALL||t===T.BRK)wallHp[idx(x,y)]=CFG.wallHp.stone;
    else if(t===T.DOOR)wallHp[idx(x,y)]=999;
  }
  // decorations on room walls (destroyed by guns)
  for(const r of rooms){
    const n=irand(1,3);
    for(let j=0;j<n;j++){
      const side=irand(0,3);
      let dx,dy,kind;
      if(side===0){dx=irand(r.x+1,r.x+r.w-2);dy=r.y-1;}
      else if(side===1){dx=irand(r.x+1,r.x+r.w-2);dy=r.y+r.h;}
      else if(side===2){dx=r.x-1;dy=irand(r.y+1,r.y+r.h-2);}
      else{dx=r.x+r.w;dy=irand(r.y+1,r.y+r.h-2);}
      kind=choice(DECO_KINDS);
      if(inBounds(dx,dy)&&map[idx(dx,dy)]===T.WALL){
        decorations.push({x:dx,y:dy,kind,hp:18,maxHp:18,alive:true});
      }
    }
  }
  return rooms;
}
function findDoorTile(r){
  // find a wall tile adjacent to the room that is also adjacent to a corridor (empty)
  const candidates=[];
  for(let xx=r.x-1;xx<=r.x+r.w;xx++){
    for(let yy=r.y-1;yy<=r.y+r.h;yy++){
      if(xx<r.x||xx>r.x+r.w-1||yy<r.y||yy>r.y+r.h-1){
        if(!inBounds(xx,yy))continue;
        if(map[idx(xx,yy)]!==T.WALL)continue;
        // must be adjacent to at least one empty tile (the room or a corridor)
        let adjEmpty=false;
        for(const [nx,ny] of [[xx-1,yy],[xx+1,yy],[xx,yy-1],[xx,yy+1]]){
          if(inBounds(nx,ny)&&map[idx(nx,ny)]===T.EMPTY){adjEmpty=true;break;}
        }
        if(adjEmpty)candidates.push({x:xx,y:yy});
      }
    }
  }
  if(!candidates.length)return null;
  return choice(candidates);
}
function carveCorridor(x1,y1,x2,y2){
  let x=x1,y=y1;
  const dx=Math.sign(x2-x1), dy=Math.sign(y2-y1);
  const horizFirst=Math.random()<0.5;
  const dig=(xx,yy)=>{ if(inBounds(xx,yy)&&map[idx(xx,yy)]===T.WALL)map[idx(xx,yy)]=T.EMPTY; };
  if(horizFirst){
    while(x!==x2){dig(x,y);x+=dx;}
    while(y!==y2){dig(x,y);y+=dy;}
  }else{
    while(y!==y2){dig(x,y);y+=dy;}
    while(x!==x2){dig(x,y);x+=dx;}
  }
  dig(x2,y2);
}

  msg:'', msgT:0,
  shake:0, flash:0,
  fps:60,
};

// player
const Player={
  x:4.5, y:4.5, angle:0,
  hp:CFG.maxHp, maxHp:CFG.maxHp,
  shield:0,
  weapon:'pistol',
  clip:12, reserve:Infinity,
  reloading:0, fireCd:0, kick:0,
  muzzle:0,
  walkPhase:0, moving:false,
  damageFlash:0,
  inv:0, // invulnerability frames
};

// entities
let enemies=[], friendlies=[], pickups=[], particles=[], projectiles=[], floaters=[];
let doors=[], wallHp={}, decorations=[], civilianRef=null;
let bossRef=null;

const ENEMY_DEFS={
  imp:   {hp:30, speed:2.1, dmg:9,  range:1.3, attackRate:0.9, money:40,  spr:'imp',   radius:0.35, aggro:7},
  spider:{hp:18, speed:3.4, dmg:6,  range:1.1, attackRate:0.6, money:25,  spr:'spider',radius:0.32, aggro:9},
  brute: {hp:90, speed:1.35,dmg:16, range:1.5, attackRate:1.2, money:85,  spr:'brute', radius:0.45, aggro:6},
  boss:  {hp:420,speed:1.15,dmg:24, range:1.8, attackRate:1.1, money:600, spr:'boss',  radius:0.6,  aggro:99},
};
const FRIENDLY_DEFS={
  guard: {hp:70, speed:2.2, dmg:14, range:7.5, attackRate:0.55, spr:'guard', radius:0.35, aggro:8, followRange:6},
  medic: {hp:50, speed:2.0, dmg:0,  range:0,    attackRate:0,   spr:'medic', radius:0.35, aggro:0,  followRange:6},
};

function spawnEntities(){
  enemies=[]; friendlies=[]; pickups=[]; particles=[]; projectiles=[]; floaters=[];
  const startRoom=rooms[0];
  Player.x=startRoom.cx+0.5; Player.y=startRoom.cy+0.5; Player.angle=rand(0,TAU);
  Player.hp=Player.maxHp; Player.shield=0; Player.weapon='pistol'; Player.clip=WEAPONS.pistol.clip; Player.reserve=Infinity;
  Player.reloading=0; Player.fireCd=0; Player.inv=1.2; Player.damageFlash=0; Player.kick=0; Player.muzzle=0;
  Game.money=0; Game.keys=0; Game.kills=0; Game.shotsFired=0; Game.shotsHit=0; Game.exitOpen=false; Game.msg=''; Game.msgT=0; Game.shake=0; Game.flash=0;
  // place enemies in later rooms
  for(let i=1;i<rooms.length;i++){
    const r=rooms[i];
    const isBoss=(i===rooms.length-1);
    const n=isBoss?1:irand(1,3);
    for(let j=0;j<n;j++){
      const type=isBoss?'boss':choice(['imp','imp','spider','brute','spider']);
      const d=ENEMY_DEFS[type];
      enemies.push({
        type, spr:d.spr, x:rand(r.x+1,r.x+r.w-1), y:rand(r.y+1,r.y+r.h-1),
        hp:d.hp, maxHp:d.hp, speed:d.speed, dmg:d.dmg, range:d.range, attackRate:d.attackRate,
        money:d.money, radius:d.radius, aggro:d.aggro,
        atkCd:rand(0,0.5), hitFlash:0, wanderA:rand(0,TAU), wanderT:0, dead:false,
        animSeed:rand(0,2),
      });
    }
    if(isBoss)bossRef=enemies[enemies.length-1];
  }
  // friendlies near start
  const fr=rooms[0];
  friendlies.push(makeFriendly('guard',fr.cx+1.5,fr.cy+1.5));
  friendlies.push(makeFriendly('medic',fr.cx-1.5,fr.cy+1.5));
  // civilian woman — flees enemies, gives money if she reaches safety
  civilianRef={type:'civilian',spr:'civilian',x:fr.cx+1.8,y:fr.cy+1.8,hp:40,maxHp:40,speed:3.6,dmg:0,range:0,attackRate:0,radius:0.32,aggro:0,followRange:0,atkCd:0,hitFlash:0,dead:false,wanderA:rand(0,TAU),wanderT:rand(0.5,2),animSeed:rand(0,2),safe:false,rewarded:false};
  friendlies.push(civilianRef);
  // pickups scattered
  for(let i=0;i<rooms.length;i++){
    const r=rooms[i];
    const n=irand(1,3);
    for(let j=0;j<n;j++){
      const kind=choice(['coin','coin','health','ammo','shield','rocket','key']);
      pickups.push({kind,x:rand(r.x+1,r.x+r.w-1),y:rand(r.y+1,r.y+r.h-1),bob:rand(0,TAU),animSeed:rand(0,2)});
    }
  }
  // exit door at farthest room (last room) — mark center as exit
  const er=rooms[rooms.length-1];
  Game.exitX=er.cx+0.5; Game.exitY=er.cy+0.5;
}
function makeFriendly(type,x,y){
  const d=FRIENDLY_DEFS[type];
  return {type,spr:d.spr,x,y,hp:d.hp,maxHp:d.hp,speed:d.speed,dmg:d.dmg,range:d.range,attackRate:d.attackRate,
    radius:d.radius,aggro:d.aggro,followRange:d.followRange,atkCd:0,hitFlash:0,dead:false,wanderA:rand(0,TAU),wanderT:0,animSeed:rand(0,2)};
}

// ---------- input ----------
const Input={keys:{},mouseDown:false,dx:0,dy:0};
if(typeof window!=='undefined'){
  window.addEventListener('keydown',e=>{
    Input.keys[e.code]=true;
    if(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyR','Tab','Digit1','Digit2','Digit3','Digit4','KeyM','Enter','Escape'].includes(e.code))e.preventDefault();
    AudioSys.init();
    if(e.code==='KeyM')toggleDisplayMode();
    if(e.code==='KeyN')AudioSys.muted=!AudioSys.muted;
    if(e.code==='Tab')cycleWeapon();
    if(e.code==='KeyR')startReload();
    if(e.code==='Digit1')selectWeapon('pistol');
    if(e.code==='Digit2')selectWeapon('shotgun');
    if(e.code==='Digit3')selectWeapon('rocket');
    if(e.code==='Digit4')selectWeapon('destructor');
    if(e.code==='Enter'||e.code==='Space'){
      if(Game.state==='title')startGame();
      else if(Game.state==='dead'||Game.state==='win')startGame();
    }
    if(e.code==='Escape'&&Game.state==='play')Game.state='paused';
    else if(e.code==='Escape'&&Game.state==='paused')Game.state='play';
  });
  window.addEventListener('keyup',e=>{Input.keys[e.code]=false;});
  cv.addEventListener('mousedown',e=>{Input.mouseDown=true;AudioSys.init();if(Game.state==='title')startGame();else if(Game.state==='paused')Game.state='play';});
  window.addEventListener('mouseup',()=>{Input.mouseDown=false;});
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('pointerlockchange',()=>{
    if(document.pointerLockElement!==cv && Game.state==='play'){/* keep playing */}
  });
  cv.addEventListener('click',()=>{
    if(Game.state==='play'&&document.pointerLockElement!==cv){try{cv.requestPointerLock&&cv.requestPointerLock();}catch(e){}}
  });
  document.addEventListener('mousemove',e=>{
    if(document.pointerLockElement===cv){Input.dx+=e.movementX||0;}
  });
  // touch controls (basic)
  let lastTouch=null;
  cv.addEventListener('touchstart',e=>{AudioSys.init();if(Game.state==='title'){startGame();return;}lastTouch=e.touches[0];},{passive:true});
  cv.addEventListener('touchmove',e=>{
    const t=e.touches[0]; if(!t||!lastTouch)return;
    const dx=t.clientX-lastTouch.clientX; Input.dx+=dx*0.06; lastTouch=t; e.preventDefault();
  },{passive:false});
  cv.addEventListener('touchend',()=>{lastTouch=null;},{passive:true});
}
function cycleWeapon(){
  const order=['pistol','shotgun','rocket','destructor'];
  const i=order.indexOf(Player.weapon);
  selectWeapon(order[(i+1)%order.length]);
}
function selectWeapon(id){
  if(Player.weapon===id)return;
  Player.weapon=id; Player.clip=WEAPONS[id].clip; Player.reloading=0; Player.fireCd=Math.max(Player.fireCd,0.25);
  AudioSys.ui();
}
function startReload(){
  const w=WEAPONS[Player.weapon];
  if(Player.reloading>0||Player.clip>=w.clip)return;
  Player.reloading=w.reload; AudioSys.reload();
}

// ---------- combat helpers ----------
function spawnParticles(x,y,color,count,speed){
  for(let i=0;i<count;i++){
    const a=rand(0,TAU), s=rand(speed*0.3,speed);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(0.3,0.7),maxLife:0.7,color,size:irand(1,3)});
  }
}
function addFloater(x,y,text,color){floaters.push({x,y,text,color,life:1.1});}
function damageEntity(ent,dmg,isEnemy){
  ent.hp-=dmg; ent.hitFlash=0.12;
  if(ent.hp<=0){
    ent.dead=true;
    if(isEnemy){
      Game.kills++; Game.money+=ent.money;
      addFloater(ent.x,ent.y,'+'+fmtMoney(ent.money),'#ffd23a');
      AudioSys.coin();
      spawnParticles(ent.x,ent.y,'#ff5a2a',14,3);
      if(ent.type==='boss'){Game.msg='BOSS DOWN — THE EXIT IS OPENING';Game.msgT=3;AudioSys.win();}
    }else{
      addFloater(ent.x,ent.y,'FRIENDLY DOWN','#e04a4a');
      spawnParticles(ent.x,ent.y,'#39ff88',12,3);
    }
  }else{
    AudioSys.hit();
  }
}
function playerDamage(dmg){
  if(Player.inv>0)return;
  if(Player.shield>0){
    const absorbed=Math.min(Player.shield,dmg);
    Player.shield-=absorbed; dmg-=absorbed;
    addFloater(Player.x,Player.y,'BLOCKED','#27e0d0');
  }
  if(dmg>0){
    Player.hp-=dmg; Player.damageFlash=0.35; Game.shake=Math.max(Game.shake,0.35);
    AudioSys.hurt();
    if(Player.hp<=0){Player.hp=0;gameOver();}
  }
}
function gameOver(){
  Game.state='dead'; AudioSys.lose();
}
function winGame(){
  Game.state='win'; AudioSys.win();
}

// ---------- weapon firing ----------
function fireWeapon(){
  if(Player.reloading>0||Player.fireCd>0)return;
  const w=WEAPONS[Player.weapon];
  if(Player.clip<=0){AudioSys.empty();startReload();return;}
  Player.clip--; Player.fireCd=w.rate; Player.kick=w.kick; Player.muzzle=0.08;
  Game.shotsFired++;
  if(Player.weapon==='pistol')AudioSys.shoot();
  else if(Player.weapon==='shotgun')AudioSys.shotgun();
  else if(Player.weapon==='rocket')AudioSys.rocket();
  else AudioSys.destructor();
  const pellets=w.pellets||1;
  for(let p=0;p<pellets;p++){
    const ang=Player.angle+rand(-w.spread,w.spread);
    castShot(ang,w);
  }
  if(Player.clip<=0)startReload();
}
function castShot(ang,w){
  const step=0.05, maxDist=w.range;
  let x=Player.x, y=Player.y;
  let hitWall=false, hitEntity=false;
  for(let d=0;d<maxDist;d+=step){
    x=Player.x+Math.cos(ang)*d; y=Player.y+Math.sin(ang)*d;
    const tx=Math.floor(x), ty=Math.floor(y);
    if(!inBounds(tx,ty))break;
    const t=map[idx(tx,ty)];
    if(t===T.WALL||t===T.BRK){
      hitWall=true;
      const key=idx(tx,ty);
      // decorations on this tile get destroyed first
      for(const d of decorations){
        if(d.alive&&d.x===tx&&d.y===ty){
          d.hp-=w.damage; d.hitFlash=0.12;
          spawnParticles(tx+0.5,ty+0.5,'#ff8a2a',8,3);
          AudioSys.hit();
          if(d.hp<=0){d.alive=false;spawnParticles(tx+0.5,ty+0.5,'#ffd23a',14,4);AudioSys.wallBreak();}
          break;
        }
      }
      // wall HP — any gun damages walls; only destructor destroys BRK quickly
      let hp=wallHp[key]!==undefined?wallHp[key]:CFG.wallHp.stone;
      const dmg=w.breaksWalls?w.damage*1.6:w.damage*0.55;
      hp-=dmg; wallHp[key]=hp;
      spawnParticles(tx+0.5,ty+0.5,'#8a8a80',6,2);
      if(hp<=0){
        map[idx(tx,ty)]=T.EMPTY; mmCacheDirty=true; delete wallHp[key];
        spawnParticles(tx+0.5,ty+0.5,'#c9a23a',18,4);
        AudioSys.wallBreak();
        Game.shake=Math.max(Game.shake,0.35);
      }
      break;
    }
    if(t===T.DOOR){
      hitWall=true;
      // doors are not shootable — they block the shot
      spawnParticles(tx+0.5,ty+0.5,'#39ff88',5,2);
      break;
    }
    for(const e of enemies){
      if(e.dead)continue;
      const dd=dist2(x,y,e.x,e.y);
      if(dd<(e.radius+0.22)*(e.radius+0.22)){
        applyDamageTo(e,w,ang);
        hitEntity=true;
        break;
      }
    }
    if(hitEntity)break;
    for(const f of friendlies){
      if(f.dead)continue;
      const dd=dist2(x,y,f.x,f.y);
      if(dd<(f.radius+0.2)*(f.radius+0.2)){
        return; // friendly blocks line of sight, no damage
      }
    }
  }
  if(w.splash){
    explodeAt(x,y,w.splash,w.damage);
  }
}
function applyDamageTo(target,w,ang){
  target.hp-=w.damage; target.hitFlash=0.15;
  Game.shotsHit++;
  spawnParticles(target.x,target.y,'#ffd23a',8,3);
  AudioSys.hit();
  if(target.hp<=0){
    target.dead=true;
    if(enemies.includes(target)){
      Game.kills++; Game.money+=target.money;
      addFloater(target.x,target.y,'+'+fmtMoney(target.money),'#ffd23a');
      AudioSys.coin();
      spawnParticles(target.x,target.y,'#ff5a2a',16,3.5);
      if(target.type==='boss'){Game.msg='BOSS DOWN — THE EXIT IS OPENING';Game.msgT=3;AudioSys.win();}
    }else{
      addFloater(target.x,target.y,'FRIENDLY DOWN','#e04a4a');
      spawnParticles(target.x,target.y,'#39ff88',12,3);
    }
  }
}
function explodeAt(x,y,radius,dmg){
  AudioSys.explode();
  Game.shake=Math.max(Game.shake,0.5);
  spawnParticles(x,y,'#ff8a2a',22,5);
  spawnParticles(x,y,'#ffd23a',10,3);
  for(const e of enemies){
    if(e.dead)continue;
    const dd=Math.sqrt(dist2(x,y,e.x,e.y));
    if(dd<radius){
      e.hp-=dmg*(1-dd/radius*0.6); e.hitFlash=0.2;
      if(e.hp<=0){
        e.dead=true; Game.kills++; Game.money+=e.money;
        addFloater(e.x,e.y,'+'+fmtMoney(e.money),'#ffd23a');
        spawnParticles(e.x,e.y,'#ff5a2a',14,3.5);
        if(e.type==='boss'){Game.msg='BOSS DOWN — THE EXIT IS OPENING';Game.msgT=3;AudioSys.win();}
      }
    }
  }
  for(const f of friendlies){
    if(f.dead)continue;
    const dd=Math.sqrt(dist2(x,y,f.x,f.y));
    if(dd<radius*0.7){ f.hp-=dmg*0.5; f.hitFlash=0.2; if(f.hp<=0){f.dead=true;addFloater(f.x,f.y,'FRIENDLY DOWN','#e04a4a');} }
  }
  const pd=Math.sqrt(dist2(x,y,Player.x,Player.y));
  if(pd<radius)playerDamage(Math.round(dmg*0.45*(1-pd/radius*0.6)));
}

// ---------- movement & collision ----------
function collideCircle(x,y,r){
  // check the tiles around and push out
  const minTx=Math.floor(x-r), maxTx=Math.floor(x+r);
  const minTy=Math.floor(y-r), maxTy=Math.floor(y+r);
  for(let ty=minTy;ty<=maxTy;ty++)for(let tx=minTx;tx<=maxTx;tx++){
    if(tileAt(tx,ty)===T.EMPTY)continue;
    // closest point on tile to circle center
    const cx=clamp(x,tx,tx+1), cy=clamp(y,ty,ty+1);
    const dx=x-cx, dy=y-cy, d2=dx*dx+dy*dy;
    if(d2<r*r){
      const d=Math.sqrt(d2)||0.001;
      const push=(r-d)/d;
      x+=dx*push; y+=dy*push;
    }
  }
  return {x,y};
}
function moveEntity(e,dx,dy,dt){
  let nx=e.x+dx*dt, ny=e.y+dy*dt;
  const res=collideCircle(nx,ny,e.radius);
  e.x=res.x; e.y=res.y;
}

// ---------- game flow helpers ----------
function startGame(){
  genMap(); spawnEntities(); mmCacheDirty=true;
  Game.state='play';
  AudioSys.init(); AudioSys.ui();
}
function resetToTitle(){ Game.state='title'; }
function openExitCheck(){
  if(Game.exitOpen)return;
  const bossDead=!bossRef||bossRef.dead;
  if(bossDead&&Game.money>=Game.quota){
    Game.exitOpen=true;
    Game.msg='EXIT OPEN — REACH THE DOOR'; Game.msgT=4;
    AudioSys.win();
  }
}

// ---------- main update ----------
function update(dt){
  if(Game.state!=='play')return;
  Game.time+=dt;
  if(Game.msgT>0)Game.msgT-=dt;
  if(Game.shake>0)Game.shake=Math.max(0,Game.shake-dt*1.6);
  if(Game.flash>0)Game.flash=Math.max(0,Game.flash-dt*2);
  if(Player.inv>0)Player.inv-=dt;
  if(Player.damageFlash>0)Player.damageFlash-=dt;
  if(Player.muzzle>0)Player.muzzle-=dt;
  if(Player.kick>0)Player.kick=Math.max(0,Player.kick-dt*40);
  if(Player.fireCd>0)Player.fireCd-=dt;
  if(Player.reloading>0){
    Player.reloading-=dt;
    if(Player.reloading<=0){
      const w=WEAPONS[Player.weapon];
      Player.clip=w.clip; Player.reloading=0;
    }
  }

  // --- player rotation ---
  if(Input.keys['ArrowLeft']||Input.keys['KeyQ'])Player.angle-=CFG.rotSpeed*dt;
  if(Input.keys['ArrowRight']||Input.keys['KeyE'])Player.angle+=CFG.rotSpeed*dt;
  if(Input.dx!==0){ Player.angle+=Input.dx*0.0022; Input.dx=0; }
  Player.angle=(Player.angle%TAU+TAU)%TAU;

  // --- player movement ---
  let mx=0,my=0;
  const fwd=(Input.keys['KeyW']||Input.keys['ArrowUp'])?1:0;
  const back=(Input.keys['KeyS']||Input.keys['ArrowDown'])?1:0;
  const strafeL=(Input.keys['KeyA'])?1:0;
  const strafeR=(Input.keys['KeyD'])?1:0;
  const f=fwd-back;
  const s=strafeR-strafeL;
  if(f!==0||s!==0){
    const cos=Math.cos(Player.angle), sin=Math.sin(Player.angle);
    const spd=CFG.playerSpeed*dt;
    mx=(cos*f + -sin*s)*spd; my=(sin*f + cos*s)*spd;
    Player.moving=true; Player.walkPhase+=dt*9;
  }else{Player.moving=false;}
  const res=collideCircle(Player.x+mx,Player.y+my,0.32);
  Player.x=res.x; Player.y=res.y;

  // --- firing ---
  if(Input.mouseDown||Input.keys['Space']){ fireWeapon(); }

  // --- enemies ---
  for(const e of enemies){
    if(e.dead)continue;
    if(e.hitFlash>0)e.hitFlash-=dt;
    const d=Math.sqrt(dist2(e.x,e.y,Player.x,Player.y));
    if(d<e.aggro){
      // chase — target player OR civilian if civilian is closer and alive
      let tx=Player.x, ty=Player.y, targetIsCivilian=false;
      if(civilianRef&&!civilianRef.dead){
        const cd=Math.sqrt(dist2(e.x,e.y,civilianRef.x,civilianRef.y));
        // only target civilian if she's much closer than the player (she's a liability, not a magnet)
        if(cd<d*0.5){tx=civilianRef.x;ty=civilianRef.y;targetIsCivilian=true;}
      }
      const ang=Math.atan2(ty-e.y,tx-e.x);
      const dd=Math.sqrt(dist2(e.x,e.y,tx,ty));
      if(dd>e.range){
        const sp=e.speed*dt;
        moveEntity(e,Math.cos(ang)*sp,Math.sin(ang)*sp,1);
      }else{
        e.atkCd-=dt;
        if(e.atkCd<=0){
          e.atkCd=e.attackRate;
          if(targetIsCivilian&&civilianRef&&!civilianRef.dead){
            civilianRef.hp-=e.dmg; civilianRef.hitFlash=0.15;
            spawnParticles(civilianRef.x,civilianRef.y,'#e06a9a',6,2);
            AudioSys.hurt();
            if(civilianRef.hp<=0){civilianRef.dead=true;addFloater(civilianRef.x,civilianRef.y,'CIVILIAN DOWN','#e04a4a');AudioSys.lose();}
          }else{
            playerDamage(e.dmg);
            spawnParticles(Player.x,Player.y,'#ff3a3a',6,2);
          }
        }
      }
    }else{
      // wander
      e.wanderT-=dt;
      if(e.wanderT<=0){e.wanderT=rand(1,2.5);e.wanderA=rand(0,TAU);}
      const sp=e.speed*0.35*dt;
      moveEntity(e,Math.cos(e.wanderA)*sp,Math.sin(e.wanderA)*sp,1);
    }
  }

  // --- friendlies (guard + medic only; civilian handled separately) ---
  for(const f of friendlies){
    if(f.dead)continue;
    if(f.type==='civilian')continue; // civilian has its own AI block below
    if(f.hitFlash>0)f.hitFlash-=dt;
    const d=Math.sqrt(dist2(f.x,f.y,Player.x,Player.y));
    if(f.type==='guard'){
      // guard: follow player, shoot nearest enemy in range
      if(d>f.followRange){
        const ang=Math.atan2(Player.y-f.y,Player.x-f.x);
        const sp=f.speed*dt;
        moveEntity(f,Math.cos(ang)*sp,Math.sin(ang)*sp,1);
      }else{
        // find nearest enemy
        let best=null,bd=1e9;
        for(const e of enemies){if(e.dead)continue;const dd=dist2(f.x,f.y,e.x,e.y);if(dd<bd){bd=dd;best=e;}}
        if(best&&bd<f.range*f.range){
          f.atkCd-=dt;
          if(f.atkCd<=0){
            f.atkCd=f.attackRate;
            // friendly shot
            best.hp-=f.dmg; best.hitFlash=0.15;
            spawnParticles(best.x,best.y,'#39ff88',5,2);
            AudioSys.shoot();
            if(best.hp<=0&&!best.dead){
              best.dead=true; Game.kills++; Game.money+=best.money;
              addFloater(best.x,best.y,'+'+fmtMoney(best.money),'#ffd23a');
              spawnParticles(best.x,best.y,'#ff5a2a',14,3.5);
              if(best.type==='boss'){Game.msg='BOSS DOWN — THE EXIT IS OPENING';Game.msgT=3;AudioSys.win();}
            }
          }
        }
      }
    }else{ // medic: follow player, heal when hurt
      if(d>f.followRange){
        const ang=Math.atan2(Player.y-f.y,Player.x-f.x);
        const sp=f.speed*dt;
        moveEntity(f,Math.cos(ang)*sp,Math.sin(ang)*sp,1);
      }
      if(Player.hp<Player.maxHp&&d<4){
        f.atkCd-=dt;
        if(f.atkCd<=0){
          f.atkCd=1.4;
          const heal=8;
          Player.hp=Math.min(Player.maxHp,Player.hp+heal);
          addFloater(Player.x,Player.y,'+'+heal+' HP','#39ff88');
          spawnParticles(Player.x,Player.y,'#39ff88',8,2);
          AudioSys.pickup();
        }
      }
    }
  }

  // --- civilian reward: if safe and close to player, give money once ---
  if(civilianRef&&!civilianRef.dead&&civilianRef.safe&&!civilianRef.rewarded){
    const d=Math.sqrt(dist2(civilianRef.x,civilianRef.y,Player.x,Player.y));
    // reward only when she's actually nearby AND has been safe for a while (not just momentarily)
    if(d<3.5){
      civilianRef.rewarded=true; Game.money+=300; AudioSys.coin();
      addFloater(civilianRef.x,civilianRef.y,'+$300 SAVED','#39ff88');
      Game.msg='CIVILIAN SAFE — +$300'; Game.msgT=2.5;
    }
  }

  // --- pickups ---
  for(const p of pickups){
    if(p.taken)continue;
    p.bob+=dt*3;
    const d=Math.sqrt(dist2(p.x,p.y,Player.x,Player.y));
    if(d<0.7){
      p.taken=true;
      applyPickup(p.kind);
    }
  }
  pickups=pickups.filter(p=>!p.taken);

  // --- particles ---
  for(const pt of particles){
    pt.life-=dt; pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vx*=0.92; pt.vy*=0.92;
  }
  particles=particles.filter(p=>p.life>0);

  // --- floaters ---
  for(const fl of floaters){fl.life-=dt; fl.y-=dt*0.6;}
  floaters=floaters.filter(f=>f.life>0);

  // --- doors: player near a closed door with a key opens it ---
  for(const d of doors){
    if(d.open)continue;
    const dd=Math.sqrt(dist2(Player.x,Player.y,d.x+0.5,d.y+0.5));
    if(dd<1.4){
      if(Game.keys>0){
        Game.keys--; d.open=true; map[idx(d.x,d.y)]=T.EMPTY; mmCacheDirty=true;
        spawnParticles(d.x+0.5,d.y+0.5,'#ffd23a',14,3);
        AudioSys.pickup();
        addFloater(Player.x,Player.y,'DOOR OPEN','#39ff88');
      }else{
        Game.msg='LOCKED — NEED A KEY'; Game.msgT=1.2;
      }
    }
  }

  // --- civilian AI: flee enemies, otherwise wander independently ---
  if(civilianRef&&!civilianRef.dead){
    const c=civilianRef;
    let nearest=null,nd=1e9;
    for(const e of enemies){if(e.dead)continue;const dd=dist2(c.x,c.y,e.x,e.y);if(dd<nd){nd=dd;nearest=e;}}
    if(nearest&&nd<6){
      // flee away from enemy — pick a direction away from the enemy AND away from walls
      let bestAng=Math.atan2(c.y-nearest.y,c.x-nearest.x);
      // try a few directions, pick the one with most open space
      let bestScore=-1;
      for(let k=-2;k<=2;k++){
        const a=bestAng+k*0.4;
        const nx=c.x+Math.cos(a)*1.5, ny=c.y+Math.sin(a)*1.5;
        const tx=Math.floor(nx), ty=Math.floor(ny);
        const open=(inBounds(tx,ty)&&map[idx(tx,ty)]===T.EMPTY)?1:0;
        const score=open + (k===0?0.3:0); // slight preference for direct flee
        if(score>bestScore){bestScore=score;bestAng=a;}
      }
      const sp=c.speed*dt;
      moveEntity(c,Math.cos(bestAng)*sp,Math.sin(bestAng)*sp,1);
      c.safe=false;
      c.wanderT=0; // reset wander timer so she doesn't drift back
    }else{
      // wander independently — keep at least MIN_DIST from player, don't follow tightly
      const d=Math.sqrt(dist2(c.x,c.y,Player.x,Player.y));
      const MIN_DIST=4.5;
      c.wanderT-=dt;
      if(c.wanderT<=0){
        c.wanderT=rand(1.2,2.8);
        // pick a random angle, but bias away from the player if too close
        let a=rand(0,TAU);
        if(d<MIN_DIST){
          const awayFromPlayer=Math.atan2(c.y-Player.y,c.x-Player.x);
          a=awayFromPlayer+rand(-0.6,0.6);
        }
        // try a few candidates, prefer ones with open space ahead
        let bestScore=-1,bestAng=a;
        for(let k=0;k<5;k++){
          const cand=a+k*0.5;
          const nx=c.x+Math.cos(cand)*1.2, ny=c.y+Math.sin(cand)*1.2;
          const tx=Math.floor(nx), ty=Math.floor(ny);
          const open=(inBounds(tx,ty)&&map[idx(tx,ty)]===T.EMPTY)?1:0;
          const score=open + (k===0?0.2:0);
          if(score>bestScore){bestScore=score;bestAng=cand;}
        }
        c.wanderA=bestAng;
      }
      // every frame: if too close to player, override direction to push away
      if(d<MIN_DIST){
        const awayFromPlayer=Math.atan2(c.y-Player.y,c.x-Player.x);
        // blend: use away direction but keep some wander variety
        c.wanderA=awayFromPlayer+Math.sin(Game.time*2)*0.3;
      }
      // only drift toward player if truly lost (very far)
      if(d>20){
        c.wanderA=Math.atan2(Player.y-c.y,Player.x-c.x);
        c.wanderT=rand(0.6,1.2);
      }
      const sp=c.speed*0.55*dt;
      moveEntity(c,Math.cos(c.wanderA)*sp,Math.sin(c.wanderA)*sp,1);
      c.safe=true;
    }
    if(c.hitFlash>0)c.hitFlash-=dt;
  }

  // --- exit check ---
  openExitCheck();
  const ed=Math.sqrt(dist2(Player.x,Player.y,Game.exitX,Game.exitY));
  if(Game.exitOpen&&ed<0.9){ winGame(); }
}
function applyPickup(kind){
  switch(kind){
    case 'coin':   {const v=irand(80,180); Game.money+=v; AudioSys.coin(); addFloater(Player.x,Player.y,'+$'+v,'#ffd23a');} break;
    case 'health': Player.hp=Math.min(Player.maxHp,Player.hp+30); AudioSys.pickup(); addFloater(Player.x,Player.y,'+30 HP','#39ff88'); break;
    case 'ammo':   /* clip refill handled by reload */ Player.clip=WEAPONS[Player.weapon].clip; AudioSys.pickup(); addFloater(Player.x,Player.y,'CLIP REFILLED','#27e0d0'); break;
    case 'shield': Player.shield=Math.min(60,Player.shield+30); AudioSys.pickup(); addFloater(Player.x,Player.y,'+30 SHIELD','#27e0d0'); break;
    case 'rocket': Game.money+=250; AudioSys.coin(); addFloater(Player.x,Player.y,'+$250','#ffd23a'); break;
    case 'key':    Game.keys++; AudioSys.pickup(); addFloater(Player.x,Player.y,'+1 KEY','#ffd23a'); break;
  }
}

// ---------- renderer ----------
const FOV=CFG.fov;
function render(){
  const S=Display.S;
  ctx.save();
  ctx.setTransform(S,0,0,S,0,0);
  ctx.imageSmoothingEnabled=false;
  // sky (dark void gradient)
  const grd=ctx.createLinearGradient(0,0,0,BH*0.5);
  grd.addColorStop(0,'#03040a'); grd.addColorStop(0.7,'#0b0e18'); grd.addColorStop(1,'#141824');
  ctx.fillStyle=grd; ctx.fillRect(0,0,BW,BH*0.5+1);
  // floor base with depth gradient
  const fg=ctx.createLinearGradient(0,BH*0.5,0,BH);
  fg.addColorStop(0,'#1c1f28'); fg.addColorStop(0.35,'#23262f'); fg.addColorStop(1,'#101218');
  ctx.fillStyle=fg; ctx.fillRect(0,BH*0.5,BW,BH*0.5);

  if(Game.state==='title'){ renderTitle(); ctx.restore();
    ctx.imageSmoothingEnabled=false;
    if(Display.mode==='low')ctx.drawImage(crtCanvas,0,0); else ctx.drawImage(vigCanvas,0,0);
    return; }

  const shakeX=(Math.random()-0.5)*Game.shake*14;
  const shakeY=(Math.random()-0.5)*Game.shake*10;

  // --- raycast walls ---
  const numRays=BW; // one per pixel column
  const zbuf=new Float32Array(numRays);
  const cosA=Math.cos(Player.angle), sinA=Math.sin(Player.angle);
  const planeX=Math.tan(FOV/2)*Math.cos(Player.angle+Math.PI/2);
  const planeY=Math.tan(FOV/2)*Math.sin(Player.angle+Math.PI/2);
  const rayDirX0=cosA-planeX, rayDirY0=sinA-planeY;
  const rayDirX1=cosA+planeX, rayDirY1=sinA+planeY;

  for(let i=0;i<numRays;i++){
    const t=i/(numRays-1);
    const rdx=rayDirX0+(rayDirX1-rayDirX0)*t;
    const rdy=rayDirY0+(rayDirY1-rayDirY0)*t;
    let mapX=Math.floor(Player.x), mapY=Math.floor(Player.y);
    const deltaX=Math.abs(1/(rdx||1e-9)), deltaY=Math.abs(1/(rdy||1e-9));
    let stepX,stepY,sideX,sideY;
    if(rdx<0){stepX=-1;sideX=(Player.x-mapX)*deltaX;}else{stepX=1;sideX=(mapX+1-Player.x)*deltaX;}
    if(rdy<0){stepY=-1;sideY=(Player.y-mapY)*deltaY;}else{stepY=1;sideY=(mapY+1-Player.y)*deltaY;}
    let hit=false, side=0, tile=T.EMPTY;
    for(let s=0;s<80&&!hit;s++){
      if(sideX<sideY){sideX+=deltaX;mapX+=stepX;side=0;}else{sideY+=deltaY;mapY+=stepY;side=1;}
      if(!inBounds(mapX,mapY)){tile=T.WALL;hit=true;break;}
      tile=map[idx(mapX,mapY)];
      if(tile!==T.EMPTY)hit=true;
    }
    if(!hit){zbuf[i]=99;continue;}
    let perp=(side===0)?(mapX-Player.x+(1-stepX)/2)/rdx:(mapY-Player.y+(1-stepY)/2)/rdy;
    if(perp<0.05)perp=0.05;
    zbuf[i]=perp;
    const lineH=Math.min(BH*2, BH/perp);
    const yTop=(BH-lineH)/2 + shakeY;
    const yBot=yTop+lineH;
    // texture selection
    let texSet;
    if(tile===T.DOOR)texSet=WALL_TEX[5]; // door texture
    else if(tile===T.BRK)texSet=WALL_TEX[4];
    else{
      // vary wall texture by room index / position hash
      const h=(mapX*73856093 ^ mapY*19349663)>>>0;
      const pick=h%3; // 0 stone,1 brick,2 metal/tech
      texSet=WALL_TEX[pick===0?1:(pick===1?2:(h%2?3:4))];
      // tech walls in some rooms
      if((h>>8)%7===0)texSet=WALL_TEX[3];
    }
    // shading level
    const fog=clamp(perp/CFG.fogDist,0,1);
    const lvl=Math.round(fog*(CFG.shadowLevels-1));
    const tex=texSet[lvl];
    // texture x coordinate
    let wallX;
    if(side===0)wallX=Player.y+perp*rdy; else wallX=Player.x+perp*rdx;
    wallX-=Math.floor(wallX);
    let texX=Math.floor(wallX*64);
    if((side===0&&rdx>0)||(side===1&&rdy<0))texX=63-texX;
    // draw vertical strip via drawImage with source rect
    const sx=texX;
    const srcY=0, srcH=64;
    const dstH=lineH;
    const dstX=i+shakeX;
    try{
      ctx.drawImage(tex,sx,srcY,1,srcH,dstX,yTop,1,dstH);
    }catch(e){}
    // side darkening
    if(side===1){ctx.fillStyle='rgba(0,0,0,0.28)';ctx.fillRect(dstX,yTop,1,dstH);}
    // exit door glow handled as sprite below
  }

  // --- floor & ceiling detail (only in low mode — HD stays clean) ---
  if(Display.mode==='low'){
    for(let y=BH*0.5+6;y<BH;y+=14){
      const t=(y-BH*0.5)/(BH*0.5);
      ctx.fillStyle='rgba(0,0,0,'+(0.05+t*0.10)+')';
      ctx.fillRect(0,y,BW,1);
    }
    // faint ceiling glow band
    ctx.fillStyle='rgba(39,224,208,0.04)';
    ctx.fillRect(0,BH*0.5-14,BW,14);
  }

  // --- sprites (painter's algorithm, far to near) ---
  const sprites=[];
  // enemies
  for(const e of enemies)if(!e.dead)sprites.push({kind:'enemy',ent:e,spr:SPRITES[e.spr],w:SPRITES[e.spr].w,h:SPRITES[e.spr].h});
  for(const f of friendlies)if(!f.dead)sprites.push({kind:'friendly',ent:f,spr:SPRITES[f.spr],w:SPRITES[f.spr].w,h:SPRITES[f.spr].h});
  for(const p of pickups)if(!p.taken)sprites.push({kind:'pickup',ent:p,spr:SPRITES[p.kind],w:SPRITES[p.kind].w,h:SPRITES[p.kind].h});
  // exit door marker (rendered as a glowing sprite at exit pos)
  if(Game.exitOpen)sprites.push({kind:'exit',ent:{x:Game.exitX,y:Game.exitY},spr:null,w:0.9,h:1.6});
  // wall decorations (destroyed by guns)
  for(const d of decorations){
    if(!d.alive)continue;
    const spr=DECO_SPRITES[d.kind];
    if(!spr)continue;
    sprites.push({kind:'deco',ent:d,spr:{img:spr.img,shadows:shadeSet(spr.img,CFG.spriteShadows),frames:[spr.img,spr.img]},w:spr.w,h:spr.h});
  }

  // sort far-to-near so closer sprites draw over farther ones
  sprites.sort((a,b)=>{
    const da=dist2(a.ent.x,a.ent.y,Player.x,Player.y);
    const db=dist2(b.ent.x,b.ent.y,Player.x,Player.y);
    return db-da;
  });
  for(const s of sprites){
    const dx=s.ent.x-Player.x, dy=s.ent.y-Player.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<0.1)continue;
    // transform to camera space
    const cA=Math.cos(Player.angle), sA=Math.sin(Player.angle);
    const camFwd=dx*cA + dy*sA;
    const camRight=-dx*sA + dy*cA;
    if(camFwd<=0.1)continue;
    const screenX=(camRight/camFwd)*(BW/2)/Math.tan(FOV/2)+BW/2 + shakeX;
    const scale=(BH/camFwd);
    const sprW=scale*s.w, sprH=scale*s.h;
    const sprX=screenX-sprW/2;
    const bob=(s.kind==='pickup')?Math.sin(s.ent.bob)*scale*0.06:0;
    const sprY=BH*0.5+scale*0.5-sprH+bob+shakeY;
    // clip against zbuf — draw column by column so walls occlude partial sprites
    const leftCol=clamp(Math.floor(sprX),0,BW-1), rightCol=clamp(Math.ceil(sprX+sprW),0,BW-1);
    let anyVisible=false;
    for(let col=leftCol;col<=rightCol;col++){ if(zbuf[col]>camFwd){anyVisible=true;break;} }
    if(!anyVisible)continue;
    // shadow level
    const fog=clamp(camFwd/CFG.fogDist,0,1);
    const lvl=Math.round(fog*(CFG.spriteShadows-1));
    if(s.kind==='exit'){
      // draw glowing exit door with per-column clipping
      for(let col=leftCol;col<=rightCol;col++){
        if(zbuf[col]<=camFwd)continue;
        const t=(col-sprX)/sprW;
        const srcX=t*sprW;
        ctx.fillStyle='rgba(57,255,136,'+(0.25+0.15*Math.sin(Game.time*4))+')';
        ctx.fillRect(col,sprY,1,sprH);
        ctx.fillStyle='#39ff88';
        ctx.fillRect(col,sprY+sprH*0.15,1,sprH*0.7);
      }
      continue;
    }
    // animation: alternate frames at ~6 fps, offset per entity for variety
    const animT=Game.time*6 + (s.ent.animSeed||0);
    const frameIdx=Math.floor(animT)%2;
    const img=s.spr.shadows[frameIdx][lvl]||s.spr.frames[frameIdx];
    const flash=(s.ent.hitFlash&&s.ent.hitFlash>0);
    if(s.kind==='deco'&&s.ent.hitFlash>0)s.ent.hitFlash-=1/60;
    // draw column by column, skipping columns where wall is closer than sprite
    const imgW=img.width, imgH=img.height;
    for(let col=leftCol;col<=rightCol;col++){
      if(zbuf[col]<=camFwd)continue;
      const t=(col-sprX)/sprW;
      const srcX=Math.floor(t*imgW);
      const dstX=col;
      try{
        ctx.drawImage(img,srcX,0,1,imgH,dstX,sprY,1,sprH);
      }catch(e){}
    }
    if(flash){
      ctx.globalAlpha=0.6; ctx.fillStyle='#fff';
      for(let col=leftCol;col<=rightCol;col++){
        if(zbuf[col]<=camFwd)continue;
        ctx.fillRect(col,sprY,1,sprH);
      }
      ctx.globalAlpha=1;
    }
    // enemy hp bar (small) — only over visible columns
    if(s.kind==='enemy'&&s.ent.hp<s.ent.maxHp){
      const bw=Math.max(8,sprW*0.7), bx=screenX-bw/2, by=sprY-6;
      ctx.fillStyle='#000'; ctx.fillRect(bx-1,by-1,bw+2,4);
      ctx.fillStyle='#e02a2a'; ctx.fillRect(bx,by,bw*clamp(s.ent.hp/s.ent.maxHp,0,1),2);
    }
    if(s.kind==='friendly'&&s.ent.hp<s.ent.maxHp){
      const bw=Math.max(8,sprW*0.7), bx=screenX-bw/2, by=sprY-6;
      ctx.fillStyle='#000'; ctx.fillRect(bx-1,by-1,bw+2,4);
      ctx.fillStyle='#39ff88'; ctx.fillRect(bx,by,bw*clamp(s.ent.hp/s.ent.maxHp,0,1),2);
    }
    // floaters attached to this sprite position? no — separate pass
  }

  // --- particles (clipped by zbuf) ---
  for(const pt of particles){
    const dx=pt.x-Player.x, dy=pt.y-Player.y;
    const dist=Math.sqrt(dx*dx+dy*dy); if(dist<0.1)continue;
    const cA=Math.cos(Player.angle), sA=Math.sin(Player.angle);
    const camFwd=dx*cA+dy*sA, camRight=-dx*sA+dy*cA;
    if(camFwd<=0.1)continue;
    const screenX=(camRight/camFwd)*(BW/2)/Math.tan(FOV/2)+BW/2+shakeX;
    const col=Math.floor(screenX);
    if(col<0||col>=BW)continue;
    if(zbuf[col]<=camFwd)continue; // wall closer than particle — skip
    const scale=(BH/camFwd);
    const size=Math.max(1,scale*0.08);
    const alpha=clamp(pt.life/pt.maxLife,0,1);
    ctx.globalAlpha=alpha;
    ctx.fillStyle=pt.color;
    ctx.fillRect(screenX-size/2,BH*0.5-size/2+shakeY,size,size);
    ctx.globalAlpha=1;
  }

  // --- floaters ---
  ctx.textAlign='center'; ctx.font='bold 11px monospace';
  for(const fl of floaters){
    const dx=fl.x-Player.x, dy=fl.y-Player.y;
    const dist=Math.sqrt(dx*dx+dy*dy); if(dist<0.1)continue;
    const cA=Math.cos(Player.angle), sA=Math.sin(Player.angle);
    const camFwd=dx*cA+dy*sA, camRight=-dx*sA+dy*cA;
    if(camFwd<=0.1)continue;
    const screenX=(camRight/camFwd)*(BW/2)/Math.tan(FOV/2)+BW/2+shakeX;
    const col=Math.floor(screenX);
    if(col<0||col>=BW)continue;
    if(zbuf[col]<=camFwd)continue; // wall closer than floater — skip
    const scale=(BH/camFwd);
    const alpha=clamp(fl.life/1.1,0,1);
    ctx.globalAlpha=alpha;
    ctx.fillStyle='#000'; ctx.fillText(fl.text,screenX+1,BH*0.5-scale*0.7+1+shakeY);
    ctx.fillStyle=fl.color; ctx.fillText(fl.text,screenX,BH*0.5-scale*0.7+shakeY);
    ctx.globalAlpha=1;
  }

  // --- weapon viewmodel ---
  renderWeapon();

  // --- damage flash ---
  if(Player.damageFlash>0){
    ctx.fillStyle='rgba(220,30,20,'+(Player.damageFlash*0.55)+')';
    ctx.fillRect(0,0,BW,BH);
  }
  if(Game.flash>0){ctx.fillStyle='rgba(255,240,200,'+(Game.flash*0.5)+')';ctx.fillRect(0,0,BW,BH);}

  // --- state overlays ---
  if(Game.state==='paused')renderPause();
  else if(Game.state==='dead')renderDead();
  else if(Game.state==='win')renderWin();
  // HUD + minimap always on top
  renderHUD();
  renderMinimap();
  // message banner on very top
  if(Game.msgT>0){
    ctx.textAlign='center'; ctx.font='bold 16px monospace';
    ctx.fillStyle='#000'; ctx.fillText(Game.msg,BW/2+1,40+1);
    ctx.fillStyle='#ffd23a'; ctx.fillText(Game.msg,BW/2,40);
  }

  ctx.restore();
  // --- display-mode post pass ---
  ctx.imageSmoothingEnabled=false;
  if(Display.mode==='low')ctx.drawImage(crtCanvas,0,0);
  else ctx.drawImage(vigCanvas,0,0);
}

function renderWeapon(){
  const w=WEAPONS[Player.weapon];
  const kick=Player.kick;
  const bob=Player.moving?Math.sin(Player.walkPhase)*3:0;
  const mw=w.img.width, mh=w.img.height;
  const targetW=Math.min(BW*0.42, mw*1.4);
  const targetH=targetW*(mh/mw);
  const x=BW/2-targetW/2 + Math.sin(Game.time*0.8)*2;
  const y=BH-targetH+kick+bob+(Player.reloading>0?26:0);
  try{ctx.drawImage(w.img,x,y,targetW,targetH);}catch(e){}
  // muzzle flash
  if(Player.muzzle>0){
    ctx.fillStyle='rgba(255,220,120,0.85)';
    const fx=BW/2+Math.sin(Game.time*13)*4, fy=BH-targetH*0.75;
    ctx.beginPath();ctx.moveTo(fx,fy-14);ctx.lineTo(fx+10,fy);ctx.lineTo(fx,fy+14);ctx.lineTo(fx-10,fy);ctx.closePath();ctx.fill();
  }
  // reload indicator
  if(Player.reloading>0){
    const w2=WEAPONS[Player.weapon];
    const frac=1-Player.reloading/w2.reload;
    ctx.fillStyle='#000'; ctx.fillRect(BW/2-50,BH-24,100,10);
    ctx.fillStyle='#27e0d0'; ctx.fillRect(BW/2-48,BH-22,96*frac,6);
    ctx.textAlign='center'; ctx.font='bold 9px monospace'; ctx.fillStyle='#bffcf2';
    ctx.fillText('RELOADING…',BW/2,BH-28);
  }
}

function renderHUD(){
  // bottom-left health
  const hx=8, hy=BH-46;
  ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(hx-2,hy-2,150,44);
  ctx.fillStyle='#e04a4a'; ctx.fillRect(hx,hy+8,140*clamp(Player.hp/Player.maxHp,0,1),10);
  ctx.fillStyle='#3a0a0a'; ctx.fillRect(hx,hy+8,140,10);
  ctx.fillStyle='#e04a4a'; ctx.fillRect(hx,hy+8,140*clamp(Player.hp/Player.maxHp,0,1),10);
  ctx.strokeStyle='#000'; ctx.strokeRect(hx,hy+8,140,10);
  ctx.textAlign='left'; ctx.font='bold 9px monospace'; ctx.fillStyle='#fff';
  ctx.fillText('HP '+Math.ceil(Player.hp)+'/'+Player.maxHp,hx,hy+6);
  if(Player.shield>0){
    ctx.fillStyle='#27e0d0'; ctx.fillRect(hx,hy+22,140*clamp(Player.shield/60,0,1),6);
    ctx.fillStyle='#bffcf2'; ctx.fillText('SHIELD '+Math.ceil(Player.shield),hx,hy+38);
  }
  // money top-right
  ctx.textAlign='right'; ctx.font='bold 14px monospace';
  ctx.fillStyle='#000'; ctx.fillText(fmtMoney(Game.money),BW-7,21);
  ctx.fillStyle='#ffd23a'; ctx.fillText(fmtMoney(Game.money),BW-8,20);
  ctx.font='bold 9px monospace'; ctx.fillStyle='#9aa';
  ctx.fillText('GOAL '+fmtMoney(Game.quota),BW-8,32);
  // kills + keys
  ctx.textAlign='left'; ctx.fillStyle='#9aa'; ctx.font='bold 9px monospace';
  ctx.fillText('KILLS '+Game.kills,8,20);
  ctx.fillStyle='#ffd23a'; ctx.fillText('KEYS '+Game.keys,8,32);
  if(civilianRef&&!civilianRef.dead){
    ctx.fillStyle=civilianRef.safe?'#39ff88':'#e04a4a';
    ctx.fillText(civilianRef.safe?'CIVILIAN SAFE':'CIVILIAN FLEEING',8,44);
  }
  // weapon info bottom-right
  const w=WEAPONS[Player.weapon];
  ctx.textAlign='right'; ctx.font='bold 11px monospace';
  ctx.fillStyle='#000'; ctx.fillText(w.name,BW-7,BH-30);
  ctx.fillStyle='#fff'; ctx.fillText(w.name,BW-8,BH-31);
  ctx.font='bold 18px monospace';
  ctx.fillStyle='#000'; ctx.fillText(Player.clip+' / ∞',BW-7,BH-10);
  ctx.fillStyle=Player.clip<=2?'#e04a4a':'#ffd23a'; ctx.fillText(Player.clip+' / ∞',BW-8,BH-11);
  // weapon slots hint
  ctx.textAlign='center'; ctx.font='bold 8px monospace'; ctx.fillStyle='#667';
  ctx.fillText('[1] PISTOL   [2] SHOTGUN   [3] ROCKET   [4] DESTRUCTOR   TAB cycle',BW/2,BH-4);
  // fps + mode (debug)
  ctx.textAlign='left'; ctx.font='8px monospace'; ctx.fillStyle='#445';
  ctx.fillText('FPS '+Math.round(Game.fps)+'  ['+Display.mode.toUpperCase()+']',8,BH-52);
}

let mmCache=null, mmCacheDirty=true;
function buildMinimapCache(){
  const mmW=92, mmH=92;
  const c=mkCanvas(mmW,mmH), g=c.getContext('2d');
  g.imageSmoothingEnabled=false;
  const sc=mmW/MAP_W;
  for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
    const t=map[idx(x,y)];
    if(t===T.WALL)g.fillStyle='#3a4150';
    else if(t===T.BRK)g.fillStyle='#c9a23a';
    else if(t===T.DOOR)g.fillStyle='#39ff88';
    else continue;
    g.fillRect(Math.floor(x*sc),Math.floor(y*sc),Math.ceil(sc),Math.ceil(sc));
  }
  mmCache=c; mmCacheDirty=false;
}
function renderMinimap(){
  const mmW=92, mmH=92, mx=BW-mmW-6, my=36;
  if(mmCacheDirty||!mmCache)buildMinimapCache();
  ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(mx-2,my-2,mmW+4,mmH+4);
  ctx.strokeStyle='#333'; ctx.strokeRect(mx-2,my-2,mmW+4,mmH+4);
  ctx.drawImage(mmCache,mx,my);
  const sc=mmW/MAP_W;
  // exit
  if(Game.exitOpen){ctx.fillStyle='#39ff88';ctx.fillRect(mx+Game.exitX*sc-2,my+Game.exitY*sc-2,4,4);}
  // enemies (red dots)
  ctx.fillStyle='#ff3a3a';
  for(const e of enemies){if(e.dead)continue;ctx.fillRect(mx+e.x*sc-1,my+e.y*sc-1,2,2);}
  // friendlies (green) + civilian (pink)
  for(const f of friendlies){if(f.dead)continue;
    if(f.type==='civilian'){ctx.fillStyle='#e06a9a';ctx.fillRect(mx+f.x*sc-1,my+f.y*sc-1,3,3);}
    else{ctx.fillStyle='#39ff88';ctx.fillRect(mx+f.x*sc-1,my+f.y*sc-1,2,2);}
  }
  // player (white triangle)
  const px=mx+Player.x*sc, py=my+Player.y*sc;
  ctx.save(); ctx.translate(px,py); ctx.rotate(Player.angle);
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(4,0); ctx.lineTo(-3,-3); ctx.lineTo(-3,3); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function renderTitle(){
  // animated background: starfield + scanlines
  ctx.fillStyle='#05060a'; ctx.fillRect(0,0,BW,BH);
  for(let i=0;i<90;i++){
    const sx=(i*97+Math.floor(Game.time*20)*0.3)%BW;
    const sy=(i*53)%BH;
    const tw=(Math.sin(Game.time*2+i)*0.5+0.5);
    ctx.fillStyle='rgba(255,255,255,'+(0.2+tw*0.5)+')';
    ctx.fillRect(sx,sy,2,2);
  }
  // big title
  ctx.textAlign='center';
  ctx.font='bold 56px monospace';
  ctx.fillStyle='#000'; ctx.fillText('VOIDFALL',BW/2+3,108+3);
  const grd=ctx.createLinearGradient(0,50,0,110);
  grd.addColorStop(0,'#ff8a2a'); grd.addColorStop(1,'#e02a2a');
  ctx.fillStyle=grd; ctx.fillText('VOIDFALL',BW/2,108);
  ctx.font='bold 12px monospace'; ctx.fillStyle='#27e0d0';
  ctx.fillText('— A PIXEL DOOM-LIKE —',BW/2,132);
  // instructions box
  ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(BW/2-200,148,400,104);
  ctx.strokeStyle='#333'; ctx.strokeRect(BW/2-200,148,400,104);
  ctx.font='11px monospace'; ctx.fillStyle='#ccc';
  ctx.fillText('WASD move · MOUSE look · CLICK fire',BW/2,172);
  ctx.fillText('1-4 weapons · TAB cycle · R reload · M HD/CRT · N mute',BW/2,190);
  ctx.fillText('Collect $'+CFG.quota+' + keys, defeat the BOSS, reach the EXIT',BW/2,208);
  ctx.fillText('Guns destroy walls & decorations · Destructor breaks breakables fast',BW/2,224);
  ctx.fillText('Protect the civilian woman — she flees enemies and pays out',BW/2,238);
  // press enter blink
  if(Math.floor(Game.time*2)%2===0){
    ctx.font='bold 16px monospace'; ctx.fillStyle='#ffd23a';
    ctx.fillText('PRESS ENTER OR CLICK TO START',BW/2,262);
  }
}
function renderPause(){
  ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(0,0,BW,BH);
  ctx.textAlign='center'; ctx.font='bold 40px monospace'; ctx.fillStyle='#fff';
  ctx.fillText('PAUSED',BW/2,BH/2-10);
  ctx.font='12px monospace'; ctx.fillStyle='#9aa';
  ctx.fillText('ESC to resume',BW/2,BH/2+22);
}
function renderDead(){
  ctx.fillStyle='rgba(40,0,0,0.78)'; ctx.fillRect(0,0,BW,BH);
  ctx.textAlign='center'; ctx.font='bold 46px monospace'; ctx.fillStyle='#e02a2a';
  ctx.fillText('YOU DIED',BW/2,BH/2-24);
  ctx.font='13px monospace'; ctx.fillStyle='#ccc';
  ctx.fillText('Kills: '+Game.kills+'   Money: '+fmtMoney(Game.money),BW/2,BH/2+14);
  ctx.fillText('Press ENTER to retry',BW/2,BH/2+44);
}
function renderWin(){
  ctx.fillStyle='rgba(0,40,20,0.78)'; ctx.fillRect(0,0,BW,BH);
  ctx.textAlign='center'; ctx.font='bold 42px monospace'; ctx.fillStyle='#39ff88';
  ctx.fillText('SECTOR CLEARED',BW/2,BH/2-30);
  ctx.font='13px monospace'; ctx.fillStyle='#ccc';
  ctx.fillText('Kills: '+Game.kills+'   Money: '+fmtMoney(Game.money),BW/2,BH/2+8);
  ctx.fillText('Accuracy: '+(Game.shotsFired?Math.round(Game.shotsHit/Game.shotsFired*100):0)+'%',BW/2,BH/2+28);
  ctx.fillText('Press ENTER for title',BW/2,BH/2+54);
}

// ---------- main loop ----------
function frame(ts){
  const dt=Math.min(0.05,(ts-Game.lastTs)/1000||0.016);
  Game.lastTs=ts;
  // fps smoothing
  if(dt>0)Game.fps=lerp(Game.fps,1/dt,0.08);
  Game.time+= (Game.state==='play'?0:dt); // title anim time
  update(dt);
  render();
  requestAnimationFrame(frame);
}
setDisplayMode('low');
genMap(); spawnEntities(); mmCacheDirty=true; // pre-generate so title screen has a world behind it
requestAnimationFrame(frame);
</script>
